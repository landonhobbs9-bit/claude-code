<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#1a1014" />
<title>Shadow Crypt — Diablo Lite</title>
<style>
  :root { --bg:#0c0a0d; --ink:#e8d6a8; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    width:100%; height:100%; overflow:hidden; background:var(--bg);
    font-family: "Courier New", monospace; color:var(--ink);
    touch-action:none; user-select:none; -webkit-user-select:none;
    overscroll-behavior:none;
  }
  #game {
    display:block; image-rendering:pixelated; image-rendering:crisp-edges;
    background:#000; touch-action:none; margin:0 auto;
  }
  /* Overlays */
  .overlay {
    position:fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    background:radial-gradient(circle at 50% 35%, #1f1014 0%, #0a0709 80%);
    z-index:50; padding:24px; gap:18px;
  }
  .hidden { display:none !important; }
  .title {
    font-size: clamp(34px, 9vw, 72px); letter-spacing:4px; font-weight:bold;
    color:#c0392b; text-shadow:0 0 18px #c0392b88, 3px 3px 0 #000;
  }
  .subtitle { font-size: clamp(13px,3.6vw,18px); color:#9a8a6a; letter-spacing:2px; }
  .btn {
    font-family:inherit; font-size: clamp(16px,4.5vw,22px); letter-spacing:2px;
    color:#1a1014; background:linear-gradient(#e8d6a8,#b89a5a);
    border:3px solid #5a4422; padding:14px 34px; cursor:pointer;
    box-shadow:0 4px 0 #3a2c14, 0 0 18px #00000088; border-radius:4px;
    transition:transform .05s;
  }
  .btn:active { transform:translateY(3px); box-shadow:0 1px 0 #3a2c14; }
  .hint { font-size: clamp(11px,3vw,14px); color:#7a6a4a; max-width:440px; line-height:1.6; }
  .stat-big { font-size: clamp(22px,6vw,34px); color:#e8d6a8; }
  .gameover .title { color:#7a1010; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<!-- Start screen -->
<div id="startScreen" class="overlay">
  <div class="title">SHADOW CRYPT</div>
  <div class="subtitle">A DIABLO·LITE DESCENT</div>
  <button class="btn" id="startBtn">ENTER THE CRYPT</button>
  <div class="hint">
    <b>Mobile:</b> drag the left pad to move · tap the red rune to attack.<br/>
    <b>Desktop:</b> WASD / arrows to move · SPACE or click to attack.<br/>
    Slay the undead, gather gold &amp; potions, and survive the descent.
  </div>
</div>

<!-- Game over screen -->
<div id="overScreen" class="overlay gameover hidden">
  <div class="title">YOU DIED</div>
  <div class="stat-big" id="overStats">Depth 1 · 0 kills</div>
  <button class="btn" id="restartBtn">DESCEND AGAIN</button>
</div>

<script>
"use strict";
/* =========================================================================
   SHADOW CRYPT — a tiny Diablo-lite top-down ARPG.
   Pure canvas, procedural pixel-art sprites, no external assets.
   ========================================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false;

// ---- World / tile config -------------------------------------------------
const TILE = 32;            // logical tile size in world pixels
const MAP_W = 40, MAP_H = 40;

// ---- Rendering scale (zoom) ----------------------------------------------
let viewScale = 2;          // world pixel -> screen pixel multiplier
let VW = 0, VH = 0;         // viewport size in CSS pixels
let DPR = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  VW = window.innerWidth;
  VH = window.innerHeight;
  canvas.width = Math.floor(VW * DPR);
  canvas.height = Math.floor(VH * DPR);
  canvas.style.width = VW + "px";
  canvas.style.height = VH + "px";
  // Zoom so roughly ~16 tiles fit across the smaller dimension on phones.
  const tilesAcross = Math.max(11, Math.min(20, VW / 64));
  viewScale = (VW / (tilesAcross * TILE));
  viewScale = Math.max(1.4, Math.min(3.2, viewScale));
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", () => setTimeout(resize, 200));

// ---- Utility -------------------------------------------------------------
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx*dx + dy*dy; };
const now = () => performance.now();

// =========================================================================
//  SPRITE FACTORY — draws pixel art onto offscreen canvases, cached.
//  Each sprite described as a grid of color keys; '.' = transparent.
// =========================================================================
const spriteCache = {};
function makeSprite(key, grid, palette, px = 4) {
  if (spriteCache[key]) return spriteCache[key];
  const h = grid.length, w = grid[0].length;
  const c = document.createElement("canvas");
  c.width = w * px; c.height = h * px;
  const g = c.getContext("2d");
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const ch = grid[y][x];
      if (ch === "." || ch === " ") continue;
      g.fillStyle = palette[ch] || "#f0f";
      g.fillRect(x * px, y * px, px, px);
    }
  }
  spriteCache[key] = c;
  return c;
}

// Warrior — armored fighter. 12x14 grid.
const WAR_PAL = { S:"#caa86a", D:"#8a6a3a", A:"#9aa4b0", a:"#5a6470", H:"#7a1f1f",
                  h:"#4a1010", E:"#000000", B:"#3a2a14", M:"#c0392b", s:"#d8b888" };
const warriorGrid = [
  "....HHHH....",
  "...HHHHHH...",
  "...HhEhEh...",  // helmet w/ eye slits
  "...SssssS...",  // face
  "...SssssS...",
  "..AAAAAAAA..",  // shoulders/armor
  ".AaAAAAAAaA.",
  "AaAAMMAAAAaA",  // chest emblem
  "AaAAMMAAAAaA",
  ".AAAAAAAAAA.",
  "..BB....BB..",  // belt sides -> legs
  "..DD....DD..",
  "..DD....DD..",
  ".BBB....BBB.",  // boots
];
makeSprite("warrior", warriorGrid, WAR_PAL, 3);

// Sword sprite (drawn separately so it can swing).
const SWORD_PAL = { B:"#e8e8f0", b:"#a0a0b0", G:"#caa86a", H:"#5a4422" };
const swordGrid = [
  "..B.",
  "..B.",
  ".bB.",
  ".bB.",
  ".bB.",
  "GGGG",
  ".H..",
  ".H..",
];
makeSprite("sword", swordGrid, SWORD_PAL, 3);

// Skeleton enemy. 11x13
const SKEL_PAL = { B:"#e6e6d8", b:"#b8b8a8", E:"#1a1a1a", D:"#8a8a78", R:"#7a1010" };
const skelGrid = [
  "...BBBB...",
  "..BBBBBB..",
  "..BEBBEB..",  // eye sockets
  "..BBBBBB..",
  "...BbbB...",
  "..BBBBBB..",
  ".B.BBBB.B.",  // ribs/arms
  "BB.BBBB.BB",
  "...B..B...",
  "...B..B...",
  "..BB..BB..",
  "..b....b..",
  "..bb..bb..",
];
makeSprite("skeleton", skelGrid, SKEL_PAL, 3);

// Demon imp enemy. 11x12
const IMP_PAL = { R:"#a02020", r:"#6a1212", E:"#ffcc00", H:"#3a0808", C:"#1a0404" };
const impGrid = [
  ".H......H.",
  ".HR....RH.",  // horns
  "..RRRRRR..",
  "..RErErR..",  // glowing eyes
  "..RRRRRR..",
  "...RrrR...",
  "..RRRRRR..",
  ".rRRRRRRr.",
  ".r.RRRR.r.",
  "...r..r...",
  "..rr..rr..",
  "..C....C..",
];
makeSprite("imp", impGrid, IMP_PAL, 3);

// Boss — Crypt Lord. 16x16, bigger px.
const BOSS_PAL = { R:"#6a0d0d", r:"#3a0606", E:"#ff3b00", A:"#2a2a32", a:"#15151a",
                   H:"#1a0303", G:"#caa86a" };
const bossGrid = [
  ".H..........H...",
  ".HR........RH...",
  "..RRRRRRRRRR....",
  "..RErErErErR....",
  "..RRRRRRRRRR....",
  ".AAAAAAAAAAAA...",
  "AaAAAARRAAAAaA..",
  "AaAAARRRRAAAaA..",
  "AaAARRRRRRAAaA..",
  ".AAARRRRRRAAA...",
  "..AAAAAAAAAA....",
  "...AA....AA.....",
  "...rr....rr.....",
  "...rr....rr.....",
  "..GrrG..GrrG....",
  "..rrrr..rrrr....",
];
makeSprite("boss", bossGrid, BOSS_PAL, 4);

// Items
makeSprite("potion", [
  ".RR.","RRRR","RrrR","RrrR","RRRR",".RR.",
], { R:"#c0392b", r:"#ff8a8a" }, 3);
makeSprite("gold", [
  ".GG.","GYYG","GYYG",".GG.",
], { G:"#a8780f", Y:"#ffd54a" }, 3);
makeSprite("chest", [
  "WWWWWW","WLLLLW","WLGGLW","WLLLLW","WWWWWW",
], { W:"#5a3a1a", L:"#8a5a2a", G:"#ffd54a" }, 4);

// =========================================================================
//  MAP GENERATION — random rooms + corridors carved out of solid rock.
//  tile 1 = wall, 0 = floor.
// =========================================================================
let map = [];
let rooms = [];
function genMap() {
  map = Array.from({ length: MAP_H }, () => new Array(MAP_W).fill(1));
  rooms = [];
  const tries = 26;
  for (let i = 0; i < tries; i++) {
    const w = randInt(4, 8), h = randInt(4, 8);
    const x = randInt(1, MAP_W - w - 1), y = randInt(1, MAP_H - h - 1);
    let ok = true;
    for (const r of rooms) {
      if (x < r.x + r.w + 1 && x + w + 1 > r.x && y < r.y + r.h + 1 && y + h + 1 > r.y) { ok = false; break; }
    }
    if (!ok) continue;
    for (let yy = y; yy < y + h; yy++)
      for (let xx = x; xx < x + w; xx++) map[yy][xx] = 0;
    rooms.push({ x, y, w, h, cx: Math.floor(x + w/2), cy: Math.floor(y + h/2) });
  }
  // connect rooms with L-corridors
  for (let i = 1; i < rooms.length; i++) {
    const a = rooms[i-1], b = rooms[i];
    carveH(a.cx, b.cx, a.cy);
    carveV(a.cy, b.cy, b.cx);
  }
}
function carveH(x1, x2, y) { for (let x = Math.min(x1,x2); x <= Math.max(x1,x2); x++) { map[y][x]=0; if(y+1<MAP_H) map[y+1][x]=0; } }
function carveV(y1, y2, x) { for (let y = Math.min(y1,y2); y <= Math.max(y1,y2); y++) { map[y][x]=0; if(x+1<MAP_W) map[y][x+1]=0; } }
function isWall(tx, ty) {
  if (tx < 0 || ty < 0 || tx >= MAP_W || ty >= MAP_H) return true;
  return map[ty][tx] === 1;
}
// circle-vs-wall collision against tile grid
function collides(px, py, r) {
  const minx = Math.floor((px - r) / TILE), maxx = Math.floor((px + r) / TILE);
  const miny = Math.floor((py - r) / TILE), maxy = Math.floor((py + r) / TILE);
  for (let ty = miny; ty <= maxy; ty++)
    for (let tx = minx; tx <= maxx; tx++)
      if (isWall(tx, ty)) return true;
  return false;
}
function moveEntity(e, dx, dy) {
  // axis-separated so we slide along walls
  if (!collides(e.x + dx, e.y, e.r)) e.x += dx;
  if (!collides(e.x, e.y + dy, e.r)) e.y += dy;
}

// =========================================================================
//  GAME STATE
// =========================================================================
let state = "start"; // start | play | dead
let player, enemies, items, particles, floatTexts;
let depth, kills, camX, camY, lastTime, accTime;
let attackCooldown, hitFlash, shake, msg, msgTimer;

function startGame() {
  depth = 1; kills = 0;
  player = {
    x: 0, y: 0, r: 11, hp: 100, maxHp: 100,
    speed: 130, gold: 0, potions: 1, level: 1, xp: 0, xpNext: 10,
    dir: 1, // facing: -1 left, 1 right
    attacking: 0, attackDir: { x: 1, y: 0 }, dmg: 22, invuln: 0, hurtFlash: 0,
    walkPhase: 0,
  };
  enemies = []; items = []; particles = []; floatTexts = [];
  attackCooldown = 0; hitFlash = 0; shake = 0; msg = ""; msgTimer = 0;
  buildLevel();
  state = "play";
  document.getElementById("startScreen").classList.add("hidden");
  document.getElementById("overScreen").classList.add("hidden");
  lastTime = now(); accTime = 0;
}

function buildLevel() {
  genMap();
  enemies = []; items = [];
  // place player in first room
  const start = rooms[0];
  player.x = (start.cx + 0.5) * TILE;
  player.y = (start.cy + 0.5) * TILE;

  const isBossLevel = depth % 4 === 0;
  // spawn enemies in other rooms, scaling with depth
  const baseCount = 4 + depth * 2;
  let spawned = 0;
  for (let ri = 1; ri < rooms.length && spawned < baseCount; ri++) {
    const r = rooms[ri];
    const n = randInt(1, 3);
    for (let k = 0; k < n && spawned < baseCount; k++) {
      const ex = (r.x + rand(0.5, r.w - 0.5)) * TILE;
      const ey = (r.y + rand(0.5, r.h - 0.5)) * TILE;
      spawnEnemy(ex, ey, Math.random() < 0.45 ? "imp" : "skeleton");
      spawned++;
    }
  }
  if (isBossLevel) {
    const r = rooms[rooms.length - 1];
    spawnEnemy((r.cx + 0.5) * TILE, (r.cy + 0.5) * TILE, "boss");
  }
  // place a chest/loot in the last room and scatter a couple potions
  const lr = rooms[rooms.length - 1];
  items.push({ kind: "chest", x: (lr.cx + 0.5)*TILE, y: (lr.cy + 0.5)*TILE, r: 14, opened:false });
  for (let i = 0; i < 2; i++) {
    const r = rooms[randInt(1, rooms.length - 1)];
    items.push({ kind:"potion", x:(r.x+rand(0.5,r.w-0.5))*TILE, y:(r.y+rand(0.5,r.h-0.5))*TILE, r:10 });
  }
  flash(isBossLevel ? "DEPTH " + depth + " — A LORD AWAITS" : "DEPTH " + depth);
}

function spawnEnemy(x, y, type) {
  const base = {
    x, y, type, dir: 1, hurtFlash: 0, attackTimer: 0, walkPhase: Math.random()*6,
  };
  if (type === "skeleton") Object.assign(base, { r:11, hp:34, maxHp:34, speed:62, dmg:9, xp:4, sprite:"skeleton" });
  else if (type === "imp") Object.assign(base, { r:10, hp:24, maxHp:24, speed:92, dmg:7, xp:5, sprite:"imp" });
  else if (type === "boss") {
    const hp = 220 + depth * 40;
    Object.assign(base, { r:22, hp, maxHp:hp, speed:54, dmg:20, xp:60, sprite:"boss", boss:true });
  }
  // scale slightly with depth
  base.hp = Math.round(base.hp * (1 + (depth-1)*0.12));
  base.maxHp = base.hp;
  base.dmg = Math.round(base.dmg * (1 + (depth-1)*0.10));
  enemies.push(base);
}

// =========================================================================
//  INPUT — keyboard + touch joystick + attack button
// =========================================================================
const keys = {};
window.addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = true;
  if (e.key === " ") { e.preventDefault(); tryAttack(); }
  if ((e.key.toLowerCase() === "q") && state === "play") usePotion();
});
window.addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });

// Virtual joystick state
const joy = { active:false, id:null, baseX:0, baseY:0, dx:0, dy:0, mag:0 };
const JOY_RADIUS = 64;

function joyZone() {
  // left third bottom area
  return { x:0, y:VH*0.35, w:VW*0.5, h:VH*0.65 };
}
function attackZone() {
  const s = Math.min(VW, VH);
  const r = Math.max(46, s*0.11);
  return { cx: VW - r - 26, cy: VH - r - 28, r };
}
function potionZone() {
  const a = attackZone();
  const r = a.r * 0.62;
  return { cx: a.cx - a.r - r - 8, cy: a.cy + a.r*0.4, r };
}

function pointInCircle(px, py, c) { return dist2(px, py, c.cx, c.cy) <= c.r*c.r; }
function pointInRect(px, py, z) { return px>=z.x && px<=z.x+z.w && py>=z.y && py<=z.y+z.h; }

function handleTouchStart(id, x, y) {
  if (state !== "play") return;
  const atk = attackZone(), pot = potionZone();
  if (pointInCircle(x, y, atk)) { tryAttack(); return; }
  if (pointInCircle(x, y, pot)) { usePotion(); return; }
  if (!joy.active && pointInRect(x, y, joyZone())) {
    joy.active = true; joy.id = id; joy.baseX = x; joy.baseY = y; joy.dx = 0; joy.dy = 0; joy.mag = 0;
  }
}
function handleTouchMove(id, x, y) {
  if (joy.active && joy.id === id) {
    let dx = x - joy.baseX, dy = y - joy.baseY;
    const m = Math.hypot(dx, dy) || 1;
    const clampedM = Math.min(m, JOY_RADIUS);
    joy.dx = dx / m; joy.dy = dy / m; joy.mag = clampedM / JOY_RADIUS;
  }
}
function handleTouchEnd(id) {
  if (joy.active && joy.id === id) { joy.active = false; joy.id = null; joy.dx = 0; joy.dy = 0; joy.mag = 0; }
}

canvas.addEventListener("touchstart", e => {
  e.preventDefault();
  for (const t of e.changedTouches) handleTouchStart(t.identifier, t.clientX, t.clientY);
}, { passive:false });
canvas.addEventListener("touchmove", e => {
  e.preventDefault();
  for (const t of e.changedTouches) handleTouchMove(t.identifier, t.clientX, t.clientY);
}, { passive:false });
canvas.addEventListener("touchend", e => {
  e.preventDefault();
  for (const t of e.changedTouches) handleTouchEnd(t.identifier);
}, { passive:false });
canvas.addEventListener("touchcancel", e => {
  for (const t of e.changedTouches) handleTouchEnd(t.identifier);
}, { passive:false });

// Mouse (desktop) — click to attack toward cursor
let mouseX = 0, mouseY = 0;
canvas.addEventListener("mousemove", e => { mouseX = e.clientX; mouseY = e.clientY; });
canvas.addEventListener("mousedown", e => {
  if (state !== "play") return;
  mouseX = e.clientX; mouseY = e.clientY;
  tryAttack();
});

// =========================================================================
//  ACTIONS
// =========================================================================
function tryAttack() {
  if (state !== "play" || attackCooldown > 0) return;
  attackCooldown = 0.42;
  player.attacking = 0.22;
  // determine attack direction
  let ax, ay;
  if (joy.active && joy.mag > 0.2) { ax = joy.dx; ay = joy.dy; }
  else {
    // toward nearest enemy if any close, else facing/mouse
    let best = null, bd = Infinity;
    for (const en of enemies) { const d = dist2(en.x, en.y, player.x, player.y); if (d < bd) { bd = d; best = en; } }
    if (best && bd < (140*140)) { ax = best.x - player.x; ay = best.y - player.y; }
    else { ax = player.dir; ay = 0; }
  }
  const m = Math.hypot(ax, ay) || 1; ax/=m; ay/=m;
  player.attackDir = { x: ax, y: ay };
  if (ax < -0.2) player.dir = -1; else if (ax > 0.2) player.dir = 1;

  // melee arc hit detection
  const reach = 46, arcCos = Math.cos(1.0); // ~115° arc
  for (const en of enemies) {
    const dx = en.x - player.x, dy = en.y - player.y;
    const d = Math.hypot(dx, dy);
    if (d > reach + en.r) continue;
    const dot = (dx/ (d||1))*ax + (dy/(d||1))*ay;
    if (dot >= arcCos) {
      const dmg = player.dmg + randInt(-3, 4);
      hurtEnemy(en, dmg, ax, ay);
    }
  }
  // swing particles
  for (let i = 0; i < 6; i++) {
    const sp = rand(60, 140);
    const a = Math.atan2(ay, ax) + rand(-0.5, 0.5);
    particles.push({ x: player.x + ax*24, y: player.y + ay*24,
      vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, life: 0.25, max:0.25, c:"#fff7d0", r:3 });
  }
  shake = Math.max(shake, 2);
}

function hurtEnemy(en, dmg, kx, ky) {
  en.hp -= dmg;
  en.hurtFlash = 0.12;
  en.x += kx * 8; en.y += ky * 8;
  if (collides(en.x, en.y, en.r)) { en.x -= kx*8; en.y -= ky*8; }
  floatTexts.push({ x: en.x, y: en.y - en.r, text: ""+dmg, life:0.7, max:0.7, c:"#ffe08a" });
  bloodBurst(en.x, en.y, en.boss ? "#6a0d0d" : (en.type==="imp" ? "#a02020" : "#cfcfcf"));
  if (en.hp <= 0) killEnemy(en);
}

function killEnemy(en) {
  en.dead = true;
  kills++;
  gainXP(en.xp);
  bloodBurst(en.x, en.y, en.boss ? "#6a0d0d" : "#8a1010", 16);
  // drops
  if (Math.random() < (en.boss ? 1 : 0.5)) {
    const g = en.boss ? randInt(40, 80) : randInt(2, 9);
    items.push({ kind:"gold", x:en.x, y:en.y, r:9, amount:g });
  }
  if (Math.random() < (en.boss ? 1 : 0.16)) items.push({ kind:"potion", x:en.x+rand(-8,8), y:en.y+rand(-8,8), r:10 });
  if (en.boss) flash("THE LORD FALLS!");
}

function gainXP(amount) {
  player.xp += amount;
  while (player.xp >= player.xpNext) {
    player.xp -= player.xpNext;
    player.level++;
    player.xpNext = Math.round(player.xpNext * 1.5 + 5);
    player.maxHp += 14; player.hp = player.maxHp; player.dmg += 4;
    flash("LEVEL UP! Lv " + player.level);
    for (let i=0;i<24;i++){ const a=rand(0,Math.PI*2),s=rand(60,180);
      particles.push({x:player.x,y:player.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.6,max:0.6,c:"#ffd54a",r:3}); }
  }
}

function usePotion() {
  if (player.potions <= 0 || player.hp >= player.maxHp) return;
  player.potions--;
  player.hp = Math.min(player.maxHp, player.hp + 45);
  flash("+45 HP");
  for (let i=0;i<14;i++){ const a=rand(0,Math.PI*2),s=rand(30,100);
    particles.push({x:player.x,y:player.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.5,max:0.5,c:"#ff6b6b",r:3}); }
}

function bloodBurst(x, y, color, n=8) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI*2), s = rand(40, 160);
    particles.push({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:rand(0.3,0.6), max:0.6, c:color, r:rand(2,4) });
  }
}

function flash(text) { msg = text; msgTimer = 2.2; }

// =========================================================================
//  UPDATE
// =========================================================================
function update(dt) {
  if (state !== "play") return;
  attackCooldown = Math.max(0, attackCooldown - dt);
  player.attacking = Math.max(0, player.attacking - dt);
  player.invuln = Math.max(0, player.invuln - dt);
  player.hurtFlash = Math.max(0, player.hurtFlash - dt);
  hitFlash = Math.max(0, hitFlash - dt);
  shake = Math.max(0, shake - dt * 18);
  if (msgTimer > 0) msgTimer -= dt;

  // --- player movement ---
  let mx = 0, my = 0;
  if (keys["arrowleft"] || keys["a"]) mx -= 1;
  if (keys["arrowright"]|| keys["d"]) mx += 1;
  if (keys["arrowup"]   || keys["w"]) my -= 1;
  if (keys["arrowdown"] || keys["s"]) my += 1;
  if (joy.active && joy.mag > 0.12) { mx += joy.dx * joy.mag; my += joy.dy * joy.mag; }
  const mm = Math.hypot(mx, my);
  if (mm > 0.01) {
    const nx = mx / Math.max(mm, 1), ny = my / Math.max(mm, 1);
    const sp = player.speed * (mm > 1 ? 1 : mm) * dt;
    moveEntity(player, nx * sp, ny * sp);
    if (nx < -0.2) player.dir = -1; else if (nx > 0.2) player.dir = 1;
    player.walkPhase += dt * 10;
  } else player.walkPhase = 0;

  // --- enemies ---
  for (const en of enemies) {
    if (en.dead) continue;
    en.hurtFlash = Math.max(0, en.hurtFlash - dt);
    en.attackTimer = Math.max(0, en.attackTimer - dt);
    const dx = player.x - en.x, dy = player.y - en.y;
    const d = Math.hypot(dx, dy) || 1;
    const touchDist = en.r + player.r;
    if (d > touchDist - 2) {
      const nx = dx/d, ny = dy/d;
      moveEntity(en, nx * en.speed * dt, ny * en.speed * dt);
      en.walkPhase += dt * 8;
      if (nx < -0.2) en.dir = -1; else if (nx > 0.2) en.dir = 1;
    }
    // attack player on contact
    if (d < touchDist + 4 && en.attackTimer <= 0) {
      en.attackTimer = 0.9;
      if (player.invuln <= 0) {
        player.hp -= en.dmg;
        player.invuln = 0.55; player.hurtFlash = 0.3; hitFlash = 0.35;
        shake = Math.max(shake, 6);
        floatTexts.push({ x:player.x, y:player.y - player.r, text:"-"+en.dmg, life:0.8, max:0.8, c:"#ff5a5a" });
        if (player.hp <= 0) { player.hp = 0; gameOver(); }
      }
    }
  }
  enemies = enemies.filter(e => !e.dead);

  // --- items pickup ---
  for (const it of items) {
    if (it.taken) continue;
    const d2 = dist2(it.x, it.y, player.x, player.y);
    if (it.kind === "chest") {
      if (!it.opened && d2 < (it.r + player.r + 6)**2) {
        it.opened = true;
        const g = randInt(15, 45);
        player.gold += g;
        flash("CHEST! +" + g + " gold");
        if (Math.random() < 0.7) { player.potions++; }
        for (let i=0;i<18;i++){const a=rand(0,Math.PI*2),s=rand(40,150);
          particles.push({x:it.x,y:it.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.6,max:0.6,c:"#ffd54a",r:3});}
      }
      continue;
    }
    if (d2 < (it.r + player.r)**2) {
      it.taken = true;
      if (it.kind === "gold") { player.gold += it.amount; floatTexts.push({x:it.x,y:it.y-10,text:"+"+it.amount+"g",life:0.8,max:0.8,c:"#ffd54a"}); }
      else if (it.kind === "potion") { player.potions++; floatTexts.push({x:it.x,y:it.y-10,text:"+potion",life:0.9,max:0.9,c:"#ff8a8a"}); }
    }
  }
  items = items.filter(it => !it.taken);

  // --- particles & floats ---
  for (const p of particles) { p.life -= dt; p.x += p.vx*dt; p.y += p.vy*dt; p.vx*=0.92; p.vy*=0.92; }
  particles = particles.filter(p => p.life > 0);
  for (const f of floatTexts) { f.life -= dt; f.y -= dt * 26; }
  floatTexts = floatTexts.filter(f => f.life > 0);

  // --- descend when all enemies dead ---
  const livingThreats = enemies.length;
  if (livingThreats === 0 && !player._descending) {
    player._descending = true;
    flash("CRYPT CLEARED — descending...");
    setTimeout(() => { if (state==="play"){ depth++; player._descending=false; buildLevel(); } }, 1400);
  }

  // --- camera follows player ---
  camX = player.x; camY = player.y;
}

function gameOver() {
  state = "dead";
  document.getElementById("overStats").textContent =
    "Depth " + depth + " · " + kills + " kills · " + player.gold + " gold · Lv " + player.level;
  document.getElementById("overScreen").classList.remove("hidden");
}

// =========================================================================
//  RENDER
// =========================================================================
function worldToScreen(wx, wy) {
  const sx = (wx - camX) * viewScale + VW/2;
  const sy = (wy - camY) * viewScale + VH/2;
  return [sx, sy];
}

function drawSpriteCentered(img, wx, wy, scale, flip, tint) {
  const w = img.width * scale, h = img.height * scale;
  let [sx, sy] = worldToScreen(wx, wy);
  ctx.save();
  ctx.translate(sx, sy);
  if (flip) ctx.scale(-1, 1);
  ctx.drawImage(img, -w/2, -h/2, w, h);
  if (tint) {
    ctx.globalCompositeOperation = "source-atop";
    ctx.fillStyle = tint;
    ctx.fillRect(-w/2, -h/2, w, h);
    ctx.globalCompositeOperation = "source-over";
  }
  ctx.restore();
}

function render() {
  // background
  ctx.fillStyle = "#05040a";
  ctx.fillRect(0, 0, VW, VH);

  // camera shake offset
  const shx = shake ? rand(-shake, shake) : 0;
  const shy = shake ? rand(-shake, shake) : 0;
  ctx.save();
  ctx.translate(shx, shy);

  if (state === "play" || state === "dead") {
    drawMap();
    drawItems();
    drawEnemies();
    drawPlayer();
    drawParticles();
    drawFloatTexts();
  }

  ctx.restore();

  // vignette / darkness for dungeon mood
  drawVignette();

  if (state === "play" || state === "dead") {
    drawHUD();
    drawTouchControls();
    drawMessage();
  }
}

function drawMap() {
  const sc = viewScale * TILE;
  // visible tile range
  const startTx = Math.floor((camX - VW/2/viewScale) / TILE) - 1;
  const endTx   = Math.ceil((camX + VW/2/viewScale) / TILE) + 1;
  const startTy = Math.floor((camY - VH/2/viewScale) / TILE) - 1;
  const endTy   = Math.ceil((camY + VH/2/viewScale) / TILE) + 1;
  for (let ty = startTy; ty <= endTy; ty++) {
    for (let tx = startTx; tx <= endTx; tx++) {
      const [sx, sy] = worldToScreen(tx*TILE, ty*TILE);
      const wall = isWall(tx, ty);
      if (wall) {
        // only draw walls adjacent to floor (saves fill + looks like edges)
        if (!isWall(tx-1,ty)||!isWall(tx+1,ty)||!isWall(tx,ty-1)||!isWall(tx,ty+1)
            ||!isWall(tx-1,ty-1)||!isWall(tx+1,ty+1)||!isWall(tx+1,ty-1)||!isWall(tx-1,ty+1)) {
          ctx.fillStyle = "#26202b";
          ctx.fillRect(sx, sy, sc+1, sc+1);
          ctx.fillStyle = "#332a3a";
          ctx.fillRect(sx, sy, sc+1, Math.max(2, sc*0.18));
          // brick lines
          ctx.fillStyle = "#1b1620";
          ctx.fillRect(sx, sy + sc*0.5, sc+1, Math.max(1, sc*0.06));
        }
      } else {
        // floor tile with subtle checker
        const shade = ((tx + ty) & 1) ? "#15121a" : "#181420";
        ctx.fillStyle = shade;
        ctx.fillRect(sx, sy, sc+1, sc+1);
        // occasional cracks
        if (((tx*7 + ty*13) % 11) === 0) {
          ctx.fillStyle = "#0e0b12";
          ctx.fillRect(sx + sc*0.3, sy + sc*0.4, sc*0.4, Math.max(1,sc*0.05));
        }
      }
    }
  }
}

function drawItems() {
  for (const it of items) {
    const bob = Math.sin(now()/300 + it.x) * 3;
    if (it.kind === "chest") {
      drawSpriteCentered(spriteCache["chest"], it.x, it.y, viewScale*0.9, false,
        it.opened ? "rgba(0,0,0,0.45)" : null);
    } else if (it.kind === "gold") {
      drawSpriteCentered(spriteCache["gold"], it.x, it.y + bob, viewScale*0.8, false);
    } else if (it.kind === "potion") {
      drawSpriteCentered(spriteCache["potion"], it.x, it.y + bob, viewScale*0.8, false);
    }
  }
}

function shadow(wx, wy, rad) {
  const [sx, sy] = worldToScreen(wx, wy);
  ctx.save();
  ctx.fillStyle = "rgba(0,0,0,0.35)";
  ctx.beginPath();
  ctx.ellipse(sx, sy + rad*viewScale*0.6, rad*viewScale, rad*viewScale*0.45, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function drawEnemies() {
  for (const en of enemies) {
    shadow(en.x, en.y + en.r*0.7, en.r*0.7);
    const bob = Math.sin(en.walkPhase) * (en.boss ? 1.5 : 2.5);
    const tint = en.hurtFlash > 0 ? "rgba(255,255,255,0.7)" : null;
    drawSpriteCentered(spriteCache[en.sprite], en.x, en.y + bob, viewScale*(en.boss?1.0:0.85), en.dir<0, tint);
    // health bar above
    if (en.hp < en.maxHp || en.boss) {
      const [sx, sy] = worldToScreen(en.x, en.y - en.r - (en.boss?16:10));
      const w = (en.boss ? 60 : 30) * viewScale*0.6;
      const h = en.boss ? 6 : 4;
      ctx.fillStyle = "#000"; ctx.fillRect(sx - w/2 - 1, sy - 1, w + 2, h + 2);
      ctx.fillStyle = en.boss ? "#c0392b" : "#9a1f1f";
      ctx.fillRect(sx - w/2, sy, w * (en.hp/en.maxHp), h);
    }
  }
}

function drawPlayer() {
  shadow(player.x, player.y + player.r*0.7, player.r*0.7);
  const bob = player.walkPhase ? Math.sin(player.walkPhase) * 2.5 : 0;
  const tint = player.hurtFlash > 0 ? "rgba(255,40,40,0.6)" :
               (player.invuln > 0 && Math.floor(now()/60)%2 ? "rgba(255,255,255,0.3)" : null);
  drawSpriteCentered(spriteCache["warrior"], player.x, player.y + bob, viewScale*0.95, player.dir<0, tint);

  // sword swing
  if (player.attacking > 0) {
    const t = 1 - (player.attacking / 0.22); // 0..1
    const baseA = Math.atan2(player.attackDir.y, player.attackDir.x);
    const swing = baseA - 1.1 + t * 2.2;
    const [sx, sy] = worldToScreen(player.x, player.y);
    const dist = (18 + t*16) * viewScale;
    ctx.save();
    ctx.translate(sx + Math.cos(swing)*dist, sy + Math.sin(swing)*dist);
    ctx.rotate(swing + Math.PI/2);
    const img = spriteCache["sword"];
    const w = img.width*viewScale*0.5, h = img.height*viewScale*0.5;
    ctx.drawImage(img, -w/2, -h/2, w, h);
    ctx.restore();
    // arc glow
    ctx.save();
    ctx.strokeStyle = "rgba(255,247,200," + (0.5*(1-t)) + ")";
    ctx.lineWidth = 4 * viewScale * 0.5;
    ctx.beginPath();
    ctx.arc(sx, sy, dist, baseA - 1.0 + t*2.0, baseA - 0.4 + t*2.0);
    ctx.stroke();
    ctx.restore();
  }
}

function drawParticles() {
  for (const p of particles) {
    const [sx, sy] = worldToScreen(p.x, p.y);
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
    ctx.fillStyle = p.c;
    const r = p.r * viewScale * 0.5;
    ctx.fillRect(sx - r/2, sy - r/2, r, r);
  }
  ctx.globalAlpha = 1;
}

function drawFloatTexts() {
  ctx.textAlign = "center";
  for (const f of floatTexts) {
    const [sx, sy] = worldToScreen(f.x, f.y);
    ctx.globalAlpha = clamp(f.life / f.max, 0, 1);
    ctx.font = "bold " + Math.round(13*viewScale*0.6) + "px 'Courier New', monospace";
    ctx.fillStyle = "#000"; ctx.fillText(f.text, sx+1, sy+1);
    ctx.fillStyle = f.c; ctx.fillText(f.text, sx, sy);
  }
  ctx.globalAlpha = 1;
}

function drawVignette() {
  const g = ctx.createRadialGradient(VW/2, VH/2, Math.min(VW,VH)*0.25, VW/2, VH/2, Math.max(VW,VH)*0.72);
  g.addColorStop(0, "rgba(0,0,0,0)");
  g.addColorStop(1, "rgba(0,0,0,0.78)");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, VW, VH);
  if (hitFlash > 0) {
    ctx.fillStyle = "rgba(150,0,0," + (hitFlash*0.8) + ")";
    ctx.fillRect(0, 0, VW, VH);
  }
}

// ---- HUD ------------------------------------------------------------------
function drawHUD() {
  const pad = 14;
  // health bar
  const barW = Math.min(260, VW*0.5), barH = 18;
  ctx.fillStyle = "rgba(0,0,0,0.6)";
  ctx.fillRect(pad-3, pad-3, barW+6, barH+6);
  ctx.fillStyle = "#3a0c0c";
  ctx.fillRect(pad, pad, barW, barH);
  ctx.fillStyle = "#c0392b";
  ctx.fillRect(pad, pad, barW * clamp(player.hp/player.maxHp,0,1), barH);
  ctx.strokeStyle = "#000"; ctx.lineWidth = 2; ctx.strokeRect(pad, pad, barW, barH);
  ctx.fillStyle = "#fff"; ctx.font = "bold 12px 'Courier New', monospace";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(Math.ceil(player.hp) + " / " + player.maxHp, pad + barW/2, pad + barH/2 + 1);

  // xp bar (thin, under hp)
  const xy = pad + barH + 4;
  ctx.fillStyle = "rgba(0,0,0,0.6)";
  ctx.fillRect(pad-3, xy-2, barW+6, 8);
  ctx.fillStyle = "#1a2a4a"; ctx.fillRect(pad, xy, barW, 5);
  ctx.fillStyle = "#4a9aff"; ctx.fillRect(pad, xy, barW * clamp(player.xp/player.xpNext,0,1), 5);

  // top-right stats
  ctx.textAlign = "right"; ctx.textBaseline = "top";
  ctx.font = "bold 14px 'Courier New', monospace";
  ctx.fillStyle = "#000"; ctx.fillText("DEPTH " + depth + "   Lv " + player.level, VW - pad + 1, pad + 1);
  ctx.fillStyle = "#e8d6a8"; ctx.fillText("DEPTH " + depth + "   Lv " + player.level, VW - pad, pad);
  ctx.fillStyle = "#000"; ctx.fillText(player.gold + " gold   " + kills + " kills", VW - pad + 1, pad + 19);
  ctx.fillStyle = "#ffd54a"; ctx.fillText(player.gold + " gold   " + kills + " kills", VW - pad, pad + 18);
  ctx.textBaseline = "alphabetic";
}

function drawTouchControls() {
  // Only show on touch-capable; harmless on desktop but keep subtle
  // Joystick
  ctx.save();
  if (joy.active) {
    ctx.globalAlpha = 0.5;
    ctx.strokeStyle = "#caa86a"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(joy.baseX, joy.baseY, JOY_RADIUS, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = "rgba(200,168,106,0.4)";
    ctx.beginPath();
    ctx.arc(joy.baseX + joy.dx*JOY_RADIUS*joy.mag, joy.baseY + joy.dy*JOY_RADIUS*joy.mag, 26, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  if (isTouch) {
    // attack button
    const a = attackZone();
    ctx.globalAlpha = attackCooldown > 0 ? 0.35 : 0.75;
    ctx.fillStyle = "#5a1010";
    ctx.beginPath(); ctx.arc(a.cx, a.cy, a.r, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = "#c0392b"; ctx.lineWidth = 4; ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.fillStyle = "#ffd9d9"; ctx.font = "bold " + Math.round(a.r*0.5) + "px 'Courier New', monospace";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("⚔", a.cx, a.cy + 1);

    // potion button
    const p = potionZone();
    ctx.globalAlpha = player.potions > 0 ? 0.75 : 0.3;
    ctx.fillStyle = "#102a40";
    ctx.beginPath(); ctx.arc(p.cx, p.cy, p.r, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = "#4a9aff"; ctx.lineWidth = 3; ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.fillStyle = "#cfe6ff"; ctx.font = "bold " + Math.round(p.r*0.55) + "px 'Courier New', monospace";
    ctx.fillText("✚", p.cx, p.cy + 1);
    ctx.font = "bold " + Math.round(p.r*0.5) + "px 'Courier New', monospace";
    ctx.fillStyle = "#fff";
    ctx.fillText("x"+player.potions, p.cx, p.cy + p.r + 10);
  }
  ctx.restore();
  ctx.textBaseline = "alphabetic";
}

function drawMessage() {
  if (msgTimer > 0 && msg) {
    ctx.save();
    ctx.globalAlpha = clamp(msgTimer, 0, 1);
    ctx.textAlign = "center";
    ctx.font = "bold " + Math.round(Math.min(34, VW*0.06)) + "px 'Courier New', monospace";
    ctx.fillStyle = "#000"; ctx.fillText(msg, VW/2+2, VH*0.18+2);
    ctx.fillStyle = "#e8d6a8"; ctx.fillText(msg, VW/2, VH*0.18);
    ctx.restore();
  }
}

// =========================================================================
//  MAIN LOOP
// =========================================================================
function loop() {
  const t = now();
  let dt = (t - lastTime) / 1000;
  lastTime = t;
  dt = Math.min(dt, 0.05); // clamp big gaps
  update(dt);
  render();
  requestAnimationFrame(loop);
}

// ---- detect touch ---------------------------------------------------------
let isTouch = ("ontouchstart" in window) || navigator.maxTouchPoints > 0;
window.addEventListener("touchstart", () => { isTouch = true; }, { once:true });

// ---- buttons --------------------------------------------------------------
document.getElementById("startBtn").addEventListener("click", () => { resize(); startGame(); });
document.getElementById("restartBtn").addEventListener("click", () => { startGame(); });

// boot
resize();
lastTime = now();
requestAnimationFrame(loop);
</script>
</body>
</html>
