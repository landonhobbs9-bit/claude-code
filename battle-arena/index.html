<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Battle Ball Arena</title>
<style>
  :root {
    --blue: #4da6ff;
    --red: #ff5e5e;
    --green: #5ee68a;
    --purple: #c08cff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d0f1a;
    color: #fff;
    font-family: 'Segoe UI', Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    user-select: none;
  }
  h1 {
    margin: 14px 0 4px;
    font-size: 28px;
    letter-spacing: 3px;
    text-transform: uppercase;
    background: linear-gradient(90deg, var(--blue), var(--green), var(--purple), var(--red));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  #hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 860px;
    max-width: 96vw;
    margin: 8px 0;
    gap: 16px;
  }
  .fighter { flex: 1; }
  .fighter .name {
    font-weight: bold;
    font-size: 15px;
    margin-bottom: 4px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .fighter.right .name { flex-direction: row-reverse; }
  .fighter .rec { font-size: 11px; color: #9aa0b5; font-weight: normal; }
  .hpbar {
    height: 18px;
    background: #2a2d3e;
    border-radius: 9px;
    overflow: hidden;
    border: 1px solid #444860;
  }
  .hpbar .fill {
    height: 100%;
    width: 100%;
    transition: width 0.15s ease-out;
    border-radius: 9px;
  }
  .fighter.right .fill { float: right; }
  .stats {
    font-size: 11px;
    color: #9aa0b5;
    margin-top: 3px;
    display: flex;
    gap: 10px;
  }
  .fighter.right .stats { justify-content: flex-end; }
  .specials { display: flex; gap: 6px; margin-top: 5px; }
  .sp { flex: 1; }
  .sp .label {
    font-size: 9px;
    color: #9aa0b5;
    letter-spacing: 0.5px;
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
  }
  .sp .meter {
    height: 6px;
    background: #2a2d3e;
    border-radius: 3px;
    overflow: hidden;
  }
  .sp .mfill { height: 100%; width: 0%; border-radius: 3px; }
  .fighter .sp.ready .mfill {
    background: linear-gradient(90deg, #ffd75e, #ffaa2b) !important;
    box-shadow: 0 0 6px #ffd75e;
  }
  .fighter .sp.ready .label { color: #ffd75e; }
  #vs {
    font-size: 22px;
    font-weight: bold;
    color: #ffd75e;
    text-shadow: 0 0 8px rgba(255, 215, 94, 0.6);
  }
  #arena-wrap { position: relative; }
  canvas {
    background: radial-gradient(circle at 50% 50%, #1a1e30, #11131f);
    border: 3px solid #3a3f5c;
    border-radius: 10px;
    display: block;
    max-width: 96vw;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(10, 12, 22, 0.88);
    border-radius: 10px;
    gap: 14px;
  }
  #overlay.hidden { display: none; }
  #overlay .title {
    font-size: 36px;
    font-weight: bold;
    letter-spacing: 2px;
    text-shadow: 0 0 20px currentColor;
  }
  #overlay .sub { color: #9aa0b5; font-size: 14px; }
  #select { display: flex; align-items: center; gap: 18px; }
  #select.hidden { display: none; }
  .sel-col h3 {
    text-align: center;
    font-size: 13px;
    letter-spacing: 2px;
    color: #9aa0b5;
    margin-bottom: 8px;
  }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .card {
    width: 132px;
    padding: 8px 6px;
    background: #1c2032;
    border: 2px solid #3a3f5c;
    border-radius: 8px;
    text-align: center;
    cursor: pointer;
    transition: transform 0.08s;
  }
  .card:hover { transform: scale(1.05); }
  .card.sel { border-color: var(--cc); box-shadow: 0 0 12px var(--cc); }
  .card .cemoji { font-size: 26px; }
  .card .cname { font-size: 12px; font-weight: bold; color: var(--cc); margin: 2px 0; }
  .card .ctag { font-size: 9px; color: #9aa0b5; }
  .card .crec { font-size: 10px; color: #ffd75e; margin-top: 3px; }
  .sel-vs { font-size: 26px; font-weight: bold; color: #ffd75e; }
  .btn-row { display: flex; gap: 12px; }
  #overlay button {
    font-size: 17px;
    font-weight: bold;
    padding: 11px 30px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    color: #fff;
    background: linear-gradient(90deg, #2f7fd6, #d63a3a);
    letter-spacing: 1px;
    transition: transform 0.1s;
  }
  #overlay button:hover { transform: scale(1.07); }
  #overlay button.alt { background: #3a3f5c; }
  #overlay button.hidden { display: none; }
  #footer {
    color: #565b73;
    font-size: 12px;
    margin: 10px 0;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  #music-btn {
    background: #1c2032;
    color: #9aa0b5;
    border: 1px solid #3a3f5c;
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 12px;
    cursor: pointer;
  }
  #music-btn.on { color: #ffd75e; border-color: #ffd75e; }
</style>
</head>
<body>

<h1>Battle Ball Arena</h1>

<div id="hud">
  <div class="fighter left">
    <div class="name"><span id="name1">&mdash;</span><span class="rec" id="rec1"></span><span id="hp1-text"></span></div>
    <div class="hpbar"><div class="fill" id="hp1"></div></div>
    <div class="stats" id="stats1"></div>
    <div class="specials" id="sp-left"></div>
  </div>
  <div id="vs">VS</div>
  <div class="fighter right">
    <div class="name"><span id="name2">&mdash;</span><span class="rec" id="rec2"></span><span id="hp2-text"></span></div>
    <div class="hpbar"><div class="fill" id="hp2"></div></div>
    <div class="stats" id="stats2"></div>
    <div class="specials" id="sp-right"></div>
  </div>
</div>

<div id="arena-wrap">
  <canvas id="arena" width="860" height="540"></canvas>
  <div id="overlay">
    <div class="title" id="overlay-title">BATTLE BALL ARENA</div>
    <div class="sub" id="overlay-sub">Choose your fighters &mdash; weapons spin, contact deals damage.</div>
    <div id="select">
      <div class="sel-col"><h3>FIGHTER 1</h3><div class="cards" id="cards1"></div></div>
      <div class="sel-vs">VS</div>
      <div class="sel-col"><h3>FIGHTER 2</h3><div class="cards" id="cards2"></div></div>
    </div>
    <div class="btn-row">
      <button id="play-btn">FIGHT!</button>
      <button id="change-btn" class="alt hidden">CHANGE FIGHTERS</button>
    </div>
  </div>
</div>

<div id="footer">
  <span>weapon hits deal damage &middot; body contact shoves &middot; first to 0 HP loses</span>
  <button id="music-btn" class="on">&#9835; MUSIC ON</button>
</div>

<script>
(() => {
  const canvas = document.getElementById('arena');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlay-title');
  const overlaySub = document.getElementById('overlay-sub');
  const selectBox = document.getElementById('select');
  const playBtn = document.getElementById('play-btn');
  const changeBtn = document.getElementById('change-btn');
  const musicBtn = document.getElementById('music-btn');

  const MAX_HP = 100;
  const HIT_COOLDOWN = 0.45;   // seconds of invulnerability after taking a weapon hit
  const WALL_BOUNCE = 0.98;    // energy kept on wall bounce
  const SPEED_DAMP = 0.6;      // how fast knockback speed decays back to cruise speed
  const WALL_SPEEDUP = 9;      // cruise speed gained on each wall bounce
  const MAX_CRUISE = 520;      // speed cap so the fight stays watchable
  const BALL_SLOWDOWN = 35;    // cruise speed lost when the balls slam into each other
  const MIN_CRUISE = 110;      // speed floor so they never stall out

  let balls, particles, shake, running, winner, lastTime;
  let projectiles, shockwaves, ghosts, announce;

  // ------------------------------------------------------------------ roster

  const CHARS = [
    {
      id: 'sword', name: 'SWORDBALL', speakName: 'Swordball', emoji: '⚔️',
      color: '#4da6ff', dark: '#2f7fd6', weapon: 'sword',
      cruise: 210, wLen: 78, wSpin: 3.4, dmg: 8, knock: 260,
      tag: ['DMG 8', 'SPIN fast', 'REACH long'], ctag: 'fast spin &middot; long blade',
    },
    {
      id: 'hammer', name: 'HAMMERBALL', speakName: 'Hammerball', emoji: '\u{1F528}',
      color: '#ff5e5e', dark: '#d63a3a', weapon: 'hammer',
      cruise: 190, wLen: 58, wSpin: -2.1, dmg: 14, knock: 420,
      tag: ['DMG 14', 'SPIN slow', 'KNOCKBACK heavy'], ctag: 'slow &middot; crushing blows',
    },
    {
      id: 'spear', name: 'SPEARBALL', speakName: 'Spearball', emoji: '\u{1F531}',
      color: '#5ee68a', dark: '#2da85c', weapon: 'spear',
      cruise: 225, wLen: 100, wSpin: 2.6, dmg: 7, knock: 230,
      tag: ['DMG 7', 'REACH huge', 'SPEED high'], ctag: 'huge reach &middot; quick pokes',
    },
    {
      id: 'kurt', name: 'KURT', speakName: 'Kurt', emoji: '\u{1F44A}',
      color: '#c08cff', dark: '#8a4fd6', weapon: 'hands',
      cruise: 200, wLen: 34, wSpin: 2.8, dmg: 9, knock: 320,
      tag: ['DMG 9', 'FIST + PALM', 'GRAB &amp; SLAM'], ctag: 'punches &middot; grabs &amp; wall-slams',
    },
  ];
  const charById = id => CHARS.find(c => c.id === id);

  // ------------------------------------------------------------ win counter

  let records = {};
  try { records = JSON.parse(localStorage.getItem('bba-records')) || {}; } catch (e) {}
  function recordOf(id) { return records[id] || (records[id] = { w: 0, l: 0 }); }
  function saveRecords() {
    try { localStorage.setItem('bba-records', JSON.stringify(records)); } catch (e) {}
  }
  function recText(id) { const r = recordOf(id); return r.w + 'W-' + r.l + 'L'; }

  // ------------------------------------------------------------------ sound

  let audio = null; // created on first FIGHT click (browsers block audio before a gesture)

  function initAudio() {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === 'suspended') audio.resume();
  }

  function tone(freq, endFreq, dur, type, vol, dest, when) {
    if (!audio) return;
    const t = when || audio.currentTime;
    const osc = audio.createOscillator();
    const gain = audio.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    osc.frequency.exponentialRampToValueAtTime(Math.max(1, endFreq), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(dest || audio.destination);
    osc.start(t);
    osc.stop(t + dur);
  }

  function noise(dur, vol, filterFreq, filterType, dest, when) {
    if (!audio) return;
    const t = when || audio.currentTime;
    const len = Math.ceil(audio.sampleRate * dur);
    const buf = audio.createBuffer(1, len, audio.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audio.createBufferSource();
    src.buffer = buf;
    const filt = audio.createBiquadFilter();
    filt.type = filterType;
    filt.frequency.value = filterFreq;
    const gain = audio.createGain();
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(filt).connect(gain).connect(dest || audio.destination);
    src.start(t);
  }

  const sfx = {
    wall(speed) { // thump, louder and brighter the faster the impact
      const v = Math.min(0.3, 0.08 + speed / 3000);
      tone(140 + speed * 0.12, 55, 0.1, 'triangle', v);
    },
    clash() { // metallic clank when the balls slam into each other
      noise(0.12, 0.28, 1800, 'bandpass');
      tone(340, 90, 0.18, 'square', 0.1);
    },
    sword() { // quick high "shing"
      noise(0.14, 0.22, 5000, 'highpass');
      tone(1200, 2200, 0.08, 'sine', 0.08);
    },
    hammer() { // heavy low boom
      tone(110, 35, 0.3, 'sine', 0.45);
      noise(0.12, 0.25, 600, 'lowpass');
    },
    spear() { // sharp piercing tick
      noise(0.08, 0.2, 6500, 'highpass');
      tone(800, 480, 0.07, 'triangle', 0.12);
    },
    punch() { // meaty mid thud
      tone(230, 70, 0.12, 'square', 0.18);
      noise(0.08, 0.2, 900, 'lowpass');
    },
    grab() { // suction snatch
      tone(600, 140, 0.2, 'sawtooth', 0.12);
      noise(0.15, 0.12, 1500, 'bandpass');
    },
    cast() { // rising power-up sweep when a special fires
      tone(280, 950, 0.28, 'sawtooth', 0.1);
      tone(140, 500, 0.3, 'square', 0.07);
    },
    beam() { // crescent wave launch
      noise(0.22, 0.18, 2500, 'bandpass');
      tone(950, 320, 0.3, 'sawtooth', 0.09);
    },
    slam() { // seismic slam / wall-slam detonation
      tone(75, 24, 0.5, 'sine', 0.55);
      noise(0.35, 0.3, 380, 'lowpass');
    },
    whoosh() { // weapon hurled through the air
      noise(0.3, 0.18, 1200, 'bandpass');
    },
  };

  // ------------------------------------------------------------------ music
  // Synthesized cyberpunk loop: four-on-the-floor kick, snappy snare, hats,
  // a driving detuned saw bassline in A minor, and a sparse neon arp lead.
  // Scheduled with a 25ms lookahead timer against the audio clock.

  const BPM = 126;
  const STEP = 60 / BPM / 2; // 8th notes
  const A1 = 55, G1 = 49, C2 = 65.41, D2 = 73.42, E2 = 82.41;
  const A3 = 220, C4 = 261.63, D4 = 293.66, E4 = 329.63, G4 = 392;
  const bassPat = [
    A1, A1, A1, A1, A1, A1, G1, A1,
    A1, A1, A1, A1, C2, C2, D2, E2,
    C2, C2, C2, C2, C2, C2, G1, C2,
    G1, G1, G1, G1, E2, D2, C2, G1,
  ];
  const leadPat = {
    1: A3, 3: C4, 5: E4, 11: D4,
    17: C4, 19: E4, 21: G4, 27: E4, 29: D4,
  };

  const music = {
    enabled: true, playing: false, timer: null, step: 0, nextTime: 0, gain: null,
    start() {
      if (!audio || this.playing || !this.enabled) return;
      if (!this.gain) {
        this.gain = audio.createGain();
        this.gain.gain.value = 0.5;
        this.gain.connect(audio.destination);
      }
      this.playing = true;
      this.step = 0;
      this.nextTime = audio.currentTime + 0.06;
      this.timer = setInterval(() => this.tick(), 25);
    },
    stop() {
      clearInterval(this.timer);
      this.playing = false;
    },
    tick() {
      while (this.nextTime < audio.currentTime + 0.12) {
        this.schedule(this.step, this.nextTime);
        this.step = (this.step + 1) % 32;
        this.nextTime += STEP;
      }
    },
    schedule(s, t) {
      const g = this.gain;
      // kick: four on the floor
      if (s % 2 === 0) tone(130, 38, 0.16, 'sine', 0.5, g, t);
      // snare on beats 2 and 4
      if (s % 8 === 2 || s % 8 === 6) noise(0.12, 0.25, 1800, 'highpass', g, t);
      // hats: tick every 8th, open hat shimmer on offbeats
      noise(0.03, s % 2 ? 0.1 : 0.05, 8000, 'highpass', g, t);
      if (s % 4 === 3) noise(0.1, 0.06, 9000, 'highpass', g, t);
      // detuned saw bass pluck
      const f = bassPat[s];
      tone(f, f, STEP * 0.9, 'sawtooth', 0.16, g, t);
      tone(f * 1.007, f * 1.007, STEP * 0.9, 'sawtooth', 0.1, g, t);
      tone(f / 2, f / 2, STEP * 0.9, 'square', 0.07, g, t);
      // neon arp lead
      const lead = leadPat[s];
      if (lead) {
        tone(lead, lead, STEP * 1.6, 'square', 0.05, g, t);
        tone(lead * 2.003, lead * 2.003, STEP * 1.6, 'sawtooth', 0.025, g, t);
      }
    },
  };

  musicBtn.addEventListener('click', () => {
    music.enabled = !music.enabled;
    musicBtn.textContent = '♫ MUSIC ' + (music.enabled ? 'ON' : 'OFF');
    musicBtn.classList.toggle('on', music.enabled);
    if (!music.enabled) music.stop();
    else if (audio) music.start();
  });

  // -------------------------------------------------------------- announcer

  function say(text) {
    if (!('speechSynthesis' in window)) return;
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 0.95;
      u.pitch = 0.6; // big boomy announcer voice
      u.volume = 1;
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }

  // --------------------------------------------------------------- specials
  // Each ball carries 3 weapon-themed specials. They charge over time, the AI
  // casts them when full (and the enemy is in the right range band), then the
  // meter empties and recharges — that recharge is the cooldown.
  // Special hits BYPASS the normal post-hit invulnerability window (they only
  // apply it), otherwise close-range specials like Seismic Slam whiff against
  // a target that was just tagged by a melee swing.

  function specialDefs(weapon) {
    switch (weapon) {
      case 'sword': return [
        { key: 'whirlwind', name: 'WHIRLWIND',     charge: 9,  range: [0, 260] },
        { key: 'lunge',     name: 'BLADE RUSH',    charge: 7,  range: [240, 9999] },
        { key: 'beam',      name: 'CRESCENT WAVE', charge: 12, range: [300, 9999] },
      ];
      case 'hammer': return [
        { key: 'slam',  name: 'SEISMIC SLAM', charge: 10, range: [0, 210] },
        { key: 'throw', name: 'HAMMER HURL',  charge: 12, range: [280, 9999] },
        { key: 'rage',  name: 'TITAN RAGE',   charge: 9,  range: [0, 9999] },
      ];
      case 'spear': return [
        { key: 'skewer',  name: 'SKEWER STORM',   charge: 8,  range: [0, 300] },
        { key: 'javelin', name: 'JAVELIN TOSS',   charge: 11, range: [280, 9999] },
        { key: 'drive',   name: 'PIERCING DRIVE', charge: 7,  range: [240, 9999] },
      ];
      case 'hands': return [
        { key: 'flurry',  name: 'FIST FLURRY',   charge: 8,  range: [0, 260] },
        { key: 'megaton', name: 'MEGATON PUNCH', charge: 9,  range: [220, 9999] },
        { key: 'vortex',  name: 'VORTEX GRIP',   charge: 11, range: [140, 520] },
      ];
    }
  }

  function castSpecial(b, foe, s) {
    announce = { text: s.name + '!', color: b.color, t: 1.3, max: 1.3 };
    sfx.cast();
    const aim = Math.atan2(foe.y - b.y, foe.x - b.x);
    switch (s.key) {
      case 'whirlwind': // sword spins wildly, raking the enemy with rapid cuts
      case 'flurry':    // fists become a blur of jabs
        b.activeSpecial = { key: s.key, t: 1.7, elapsed: 0 };
        break;
      case 'skewer': // spear pistons in and out with rapid thrusts
        b.activeSpecial = { key: s.key, t: 1.6, elapsed: 0 };
        break;
      case 'lunge':   // dash at the enemy, blade-first
      case 'drive':   // spear-first piercing charge
      case 'megaton': // rocket punch dash
        b.vx = Math.cos(aim) * (s.key === 'drive' ? 820 : 770);
        b.vy = Math.sin(aim) * (s.key === 'drive' ? 820 : 770);
        b.activeSpecial = { key: s.key, t: 0.65 };
        break;
      case 'beam': // launch a flying crescent of sword energy
        projectiles.push({
          type: 'beam',
          x: b.x + Math.cos(aim) * (b.r + 10), y: b.y + Math.sin(aim) * (b.r + 10),
          vx: Math.cos(aim) * 470, vy: Math.sin(aim) * 470,
          ang: aim, owner: b, dmg: 12, knock: 340, life: 2.5,
        });
        sfx.beam();
        break;
      case 'slam': // wind up, then blast an expanding shockwave
        b.activeSpecial = { key: s.key, t: 1.1, dur: 1.1, windup: 0.55, fired: false };
        break;
      case 'throw':   // hurl the hammer; it comes back boomerang-style
      case 'javelin': // pitch the spear like a javelin, then recall it
        b.weaponOut = true;
        projectiles.push({
          type: 'thrown', weapon: b.weapon,
          x: b.x, y: b.y,
          vx: Math.cos(aim) * (s.key === 'javelin' ? 660 : 460),
          vy: Math.sin(aim) * (s.key === 'javelin' ? 660 : 460),
          owner: b, dmg: s.key === 'javelin' ? 14 : 16,
          knock: s.key === 'javelin' ? 380 : 480,
          spin: aim, t: 0, phase: 'out',
        });
        sfx.whoosh();
        break;
      case 'rage': // hammer grows huge: bonus damage, reach and knockback
        b.activeSpecial = { key: s.key, t: 3.0 };
        break;
      case 'vortex': // magnetic palm drags the enemy in for an empowered slam
        b.activeSpecial = { key: s.key, t: 1.4 };
        b.empowerT = 2.4; // empowered grab window
        break;
    }
  }

  function updateSpecials(b, foe, dt) {
    // charge meters
    for (const s of b.specials) {
      if (s.timer < s.charge) { s.timer += dt; continue; }
      if (b.activeSpecial || b.weaponOut || b.grab || b.grabbedBy) continue;
      const dist = Math.hypot(foe.x - b.x, foe.y - b.y);
      // ready: fire when the enemy is in this move's range band (small random
      // delay so the two balls don't cast in lockstep)
      if (dist >= s.range[0] && dist <= s.range[1] && Math.random() < dt * 2.5) {
        s.timer = 0;
        castSpecial(b, foe, s);
      }
    }

    b.empowerT = Math.max(0, (b.empowerT || 0) - dt);

    // active special effects
    const a = b.activeSpecial;
    if (!a) return;
    a.t -= dt;
    if (a.elapsed !== undefined) a.elapsed += dt;
    if (a.key === 'lunge' || a.key === 'drive' || a.key === 'megaton') {
      b.wAngle = Math.atan2(foe.y - b.y, foe.x - b.x); // weapon locked on target
      ghosts.push({ x: b.x, y: b.y, wAngle: b.wAngle, weapon: b.weapon,
                    r: b.r, wLen: b.wLen, color: b.color, body: true,
                    life: 0.22, max: 0.22 });
    }
    if (a.key === 'whirlwind' || a.key === 'flurry' || a.key === 'skewer') {
      ghosts.push({ x: b.x, y: b.y, wAngle: b.wAngle, weapon: b.weapon,
                    r: b.r, wLen: effectiveReach(b), color: b.color, body: false,
                    life: 0.18, max: 0.18 });
    }
    if (a.key === 'slam' && !a.fired && a.dur - a.t >= a.windup) {
      a.fired = true;
      shockwaves.push({ x: b.x, y: b.y, r: b.r, max: 200, owner: b,
                        dmg: 18, knock: 640, hit: false });
      sfx.slam();
      shake = 14;
    }
    if (a.key === 'rage' && Math.random() < dt * 18) {
      // embers boiling off the enraged hammerball
      particles.push({
        x: b.x + (Math.random() - 0.5) * b.r * 2, y: b.y + b.r * 0.5,
        vx: (Math.random() - 0.5) * 40, vy: -60 - Math.random() * 60,
        life: 0.4, max: 0.4, size: 2 + Math.random() * 2.5,
        color: '#ff7b3b', text: null,
      });
    }
    if (a.key === 'vortex') {
      // drag the enemy toward Kurt's waiting palm
      if (!foe.grabbedBy) {
        const dx = b.x - foe.x, dy = b.y - foe.y;
        const d = Math.hypot(dx, dy) || 1;
        foe.vx += (dx / d) * 700 * dt;
        foe.vy += (dy / d) * 700 * dt;
      }
      if (Math.random() < dt * 30) {
        // purple energy streaming from the enemy into the vortex
        const mx = foe.x + (b.x - foe.x) * Math.random();
        const my = foe.y + (b.y - foe.y) * Math.random();
        particles.push({ x: mx, y: my, vx: (b.x - mx) * 2, vy: (b.y - my) * 2,
                         life: 0.3, max: 0.3, size: 2.5, color: '#c08cff', text: null });
      }
    }
    if (a.t <= 0) b.activeSpecial = null;
  }

  // current weapon reach, accounting for active specials
  function effectiveReach(b) {
    const a = b.activeSpecial;
    if (!a) return b.wLen;
    if (a.key === 'rage') return b.wLen * 1.25;
    if (a.key === 'skewer') return b.wLen * (0.7 + 0.5 * Math.abs(Math.sin(a.elapsed * 12)));
    return b.wLen;
  }

  // shared hit application — bypasses the invuln window, then re-applies it
  function dealHit(def, dmg, fromX, fromY, knock, color, shakeAmt) {
    def.hp = Math.max(0, def.hp - dmg);
    def.cooldown = HIT_COOLDOWN;
    def.hitFlash = 0.25;
    let kx = def.x - fromX, ky = def.y - fromY;
    const kd = Math.hypot(kx, ky) || 1;
    def.vx += (kx / kd) * knock;
    def.vy += (ky / kd) * knock;
    spawnSparks(def.x - (kx / kd) * def.r, def.y - (ky / kd) * def.r, color, 14, 300);
    spawnDamageText(def.x, def.y - def.r - 8, '-' + dmg, color);
    shake = shakeAmt;
    updateHud();
  }

  function updateProjectiles(dt) {
    for (const p of projectiles) {
      const foe = p.owner === balls[0] ? balls[1] : balls[0];
      if (p.type === 'beam') {
        p.x += p.vx * dt; p.y += p.vy * dt;
        p.life -= dt;
        if (Math.random() < dt * 40) {
          particles.push({ x: p.x, y: p.y, vx: 0, vy: 0, life: 0.2, max: 0.2,
                           size: 2.5, color: '#9fdcff', text: null });
        }
        if (!foe.grabbedBy && Math.hypot(foe.x - p.x, foe.y - p.y) < foe.r + 16) {
          dealHit(foe, p.dmg, p.x, p.y, p.knock, '#9fdcff', 7);
          sfx.sword();
          p.life = 0;
        }
        if (p.x < -40 || p.x > W + 40 || p.y < -40 || p.y > H + 40) p.life = 0;
        p.dead = p.life <= 0;
      } else if (p.type === 'thrown') {
        p.t += dt;
        p.spin += (p.weapon === 'hammer' ? 14 : 11) * dt;
        const target = p.phase === 'out' ? foe : p.owner;
        // steer toward the target (homing out, hard homing back)
        const ax = target.x - p.x, ay = target.y - p.y;
        const ad = Math.hypot(ax, ay) || 1;
        const steer = p.phase === 'out' ? 950 : 1600;
        p.vx += (ax / ad) * steer * dt;
        p.vy += (ay / ad) * steer * dt;
        const sp = Math.hypot(p.vx, p.vy) || 1;
        const cap = p.weapon === 'spear' ? 660 : 560;
        if (sp > cap) { p.vx = p.vx / sp * cap; p.vy = p.vy / sp * cap; }
        p.x += p.vx * dt; p.y += p.vy * dt;
        if (p.phase === 'out') {
          if (!foe.grabbedBy && Math.hypot(foe.x - p.x, foe.y - p.y) < foe.r + 22) {
            dealHit(foe, p.dmg, p.x, p.y, p.knock, '#ffb347', 10);
            if (p.weapon === 'hammer') sfx.hammer(); else sfx.spear();
            p.phase = 'back';
          } else if (p.t > 1.2) {
            p.phase = 'back';
          }
        } else if (Math.hypot(p.owner.x - p.x, p.owner.y - p.y) < p.owner.r) {
          p.owner.weaponOut = false; // caught it
          p.dead = true;
        }
      }
    }
    projectiles = projectiles.filter(p => !p.dead);

    for (const s of shockwaves) {
      s.r += 420 * dt;
      const foe = s.owner === balls[0] ? balls[1] : balls[0];
      if (!s.hit && !foe.grabbedBy &&
          Math.hypot(foe.x - s.x, foe.y - s.y) < s.r + foe.r) {
        s.hit = true;
        dealHit(foe, s.dmg, s.x, s.y, s.knock, '#ffb347', 12);
        sfx.hammer();
      }
      s.dead = s.r >= s.max;
    }
    shockwaves = shockwaves.filter(s => !s.dead);

    for (const g of ghosts) g.life -= dt;
    ghosts = ghosts.filter(g => g.life > 0);
  }

  // ---------------------------------------------------------------- fighters

  function makeBall(charId, side) {
    const c = charById(charId);
    return {
      ...c,
      x: side === 0 ? W * 0.25 : W * 0.75,
      y: H * 0.5,
      vx: side === 0 ? 170 : -150,
      vy: side === 0 ? -130 : 140,
      r: 32,
      hp: MAX_HP,
      wAngle: side === 0 ? 0 : Math.PI,
      specials: specialDefs(c.weapon).map(s => ({ ...s, timer: 0 })),
      activeSpecial: null,
      weaponOut: false,
      grab: null,       // { foe, t } while holding someone
      grabbedBy: null,  // set on the victim while held
      grabCd: 0,
      empowerT: 0,
      slamArmed: 0,     // wall-slam damage window after being thrown
      slamDmg: 0,
      slamBy: null,
      hitFlash: 0,
      cooldown: 0,
      hpEl: document.getElementById('hp' + (side + 1)),
      hpText: document.getElementById('hp' + (side + 1) + '-text'),
      nameEl: document.getElementById('name' + (side + 1)),
      recEl: document.getElementById('rec' + (side + 1)),
      statsEl: document.getElementById('stats' + (side + 1)),
      spWrap: document.getElementById(side === 0 ? 'sp-left' : 'sp-right'),
    };
  }

  function setupFight(id1, id2) {
    balls = [makeBall(id1, 0), makeBall(id2, 1)];
    if (id1 === id2) balls[1].name += ' II'; // mirror match
    particles = [];
    projectiles = [];
    shockwaves = [];
    ghosts = [];
    announce = null;
    shake = 0;
    winner = null;
    for (const b of balls) {
      b.nameEl.textContent = b.name;
      b.nameEl.style.color = b.color;
      b.recEl.textContent = recText(b.id);
      b.statsEl.innerHTML = b.tag.map(t => '<span>' + t + '</span>').join('');
      b.hpEl.style.background = 'linear-gradient(90deg, ' + b.dark + ', ' + b.color + ')';
      b.spWrap.innerHTML = '';
      b.spEls = b.specials.map(s => {
        const div = document.createElement('div');
        div.className = 'sp';
        div.innerHTML = '<div class="label">' + s.name +
                        '</div><div class="meter"><div class="mfill"></div></div>';
        b.spWrap.appendChild(div);
        const fill = div.querySelector('.mfill');
        fill.style.background = b.color;
        return { root: div, fill };
      });
    }
    updateHud();
    updateSpecialHud();
  }

  // ------------------------------------------------------------------ update

  function update(dt) {
    for (const b of balls) {
      b.cooldown = Math.max(0, b.cooldown - dt);
      b.hitFlash = Math.max(0, b.hitFlash - dt);
      b.grabCd = Math.max(0, b.grabCd - dt);
      b.slamArmed = Math.max(0, b.slamArmed - dt);

      if (b.grabbedBy) continue; // pinned to the grabber's palm, no physics

      // move
      b.x += b.vx * dt;
      b.y += b.vy * dt;

      // bounce off walls — each bounce makes the ball cruise a bit faster
      let hitWall = false;
      if (b.x - b.r < 0)  { b.x = b.r;     b.vx =  Math.abs(b.vx) * WALL_BOUNCE; hitWall = true; }
      if (b.x + b.r > W)  { b.x = W - b.r; b.vx = -Math.abs(b.vx) * WALL_BOUNCE; hitWall = true; }
      if (b.y - b.r < 0)  { b.y = b.r;     b.vy =  Math.abs(b.vy) * WALL_BOUNCE; hitWall = true; }
      if (b.y + b.r > H)  { b.y = H - b.r; b.vy = -Math.abs(b.vy) * WALL_BOUNCE; hitWall = true; }
      if (hitWall) {
        b.cruise = Math.min(MAX_CRUISE, b.cruise + WALL_SPEEDUP);
        if (b.slamArmed > 0) {
          // thrown by Kurt: the wall is the weapon
          b.hp = Math.max(0, b.hp - b.slamDmg);
          b.hitFlash = 0.3;
          spawnSparks(b.x, b.y, '#c08cff', 20, 360);
          spawnDamageText(b.x, b.y - b.r - 8, '-' + b.slamDmg,
                          b.slamBy ? b.slamBy.color : '#c08cff');
          sfx.slam();
          shake = 13;
          b.slamArmed = 0;
          updateHud();
        } else {
          sfx.wall(Math.hypot(b.vx, b.vy));
        }
      }

      // ease speed back toward cruise speed after knockbacks
      const sp = Math.hypot(b.vx, b.vy) || 1;
      const target = sp + (b.cruise - sp) * Math.min(1, SPEED_DAMP * dt);
      b.vx = b.vx / sp * target;
      b.vy = b.vy / sp * target;

      // the weapon is the only thing that animates on the ball: spin it
      // (whirlwind / flurry send it into overdrive)
      const ak = b.activeSpecial ? b.activeSpecial.key : null;
      const spinMult = (ak === 'whirlwind' || ak === 'flurry') ? 4.5 : 1;
      b.wAngle += b.wSpin * spinMult * dt;
    }

    // grabs: hold the victim at the palm, then hurl them along our heading
    for (const b of balls) {
      if (!b.grab) continue;
      const g = b.grab;
      g.t -= dt;
      const pa = b.wAngle + Math.PI; // palm side
      g.foe.x = b.x + Math.cos(pa) * (b.r + b.wLen + g.foe.r * 0.6);
      g.foe.y = b.y + Math.sin(pa) * (b.r + b.wLen + g.foe.r * 0.6);
      g.foe.x = Math.max(g.foe.r, Math.min(W - g.foe.r, g.foe.x));
      g.foe.y = Math.max(g.foe.r, Math.min(H - g.foe.r, g.foe.y));
      if (g.t <= 0) {
        // release: throw along Kurt's trajectory
        const spd = Math.hypot(b.vx, b.vy);
        let dx, dy;
        if (spd > 40) { dx = b.vx / spd; dy = b.vy / spd; }
        else { dx = Math.cos(pa); dy = Math.sin(pa); }
        const power = g.empowered ? 1150 : 950;
        g.foe.vx = dx * power;
        g.foe.vy = dy * power;
        g.foe.slamArmed = 1.2;
        g.foe.slamDmg = g.empowered ? 16 : 12;
        g.foe.slamBy = b;
        g.foe.grabbedBy = null;
        b.grab = null;
        b.grabCd = 5;
        sfx.whoosh();
      }
    }

    updateSpecials(balls[0], balls[1], dt);
    updateSpecials(balls[1], balls[0], dt);
    updateSpecialHud();

    bodyCollision(balls[0], balls[1]);
    weaponHit(balls[0], balls[1]);
    weaponHit(balls[1], balls[0]);
    updateProjectiles(dt);

    if (announce) {
      announce.t -= dt;
      if (announce.t <= 0) announce = null;
    }

    // particles
    for (const p of particles) {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 0.96; p.vy *= 0.96;
      p.life -= dt;
    }
    particles = particles.filter(p => p.life > 0);
    shake = Math.max(0, shake - dt * 30);

    // win condition
    for (let i = 0; i < 2; i++) {
      if (balls[i].hp <= 0 && !winner) {
        balls[i].hp = 0;
        winner = balls[1 - i];
        endFight(balls[i]);
      }
    }
  }

  // balls shove each other: elastic bounce that can smack them into walls
  function bodyCollision(a, b) {
    if (a.grabbedBy || b.grabbedBy || a.grab || b.grab) return;
    const dx = b.x - a.x, dy = b.y - a.y;
    const dist = Math.hypot(dx, dy);
    const minDist = a.r + b.r;
    if (dist === 0 || dist >= minDist) return;

    const nx = dx / dist, ny = dy / dist;

    // separate the overlap
    const push = (minDist - dist) / 2;
    a.x -= nx * push; a.y -= ny * push;
    b.x += nx * push; b.y += ny * push;

    // swap velocity along the collision normal (equal mass elastic bounce)
    const va = a.vx * nx + a.vy * ny;
    const vb = b.vx * nx + b.vy * ny;
    if (va - vb <= 0) return; // already separating
    a.vx += (vb - va) * nx; a.vy += (vb - va) * ny;
    b.vx += (va - vb) * nx; b.vy += (va - vb) * ny;

    // slamming into each other bleeds off speed
    a.cruise = Math.max(MIN_CRUISE, a.cruise - BALL_SLOWDOWN);
    b.cruise = Math.max(MIN_CRUISE, b.cruise - BALL_SLOWDOWN);

    sfx.clash();
    spawnSparks((a.x + b.x) / 2, (a.y + b.y) / 2, '#cfd6ff', 5, 120);
  }

  // the striking segments a fighter presents: most have one weapon arm,
  // Kurt has a fist on one side and an open grabbing palm on the other
  function segmentsOf(att) {
    const reach = effectiveReach(att);
    if (att.weapon === 'hands') {
      return [
        { angle: att.wAngle, reach, kind: 'fist' },
        { angle: att.wAngle + Math.PI, reach, kind: 'palm' },
      ];
    }
    return [{ angle: att.wAngle, reach, kind: 'weapon' }];
  }

  // weapons of `att` hitting the body of `def`
  function weaponHit(att, def) {
    if (att.weaponOut) return;            // weapon is mid-flight
    if (att.grab || att.grabbedBy || def.grabbedBy) return; // grapple in progress
    if (def.hp <= 0) return;

    const spec = att.activeSpecial ? att.activeSpecial.key : null;

    for (const seg of segmentsOf(att)) {
      const cos = Math.cos(seg.angle), sin = Math.sin(seg.angle);
      const x1 = att.x + cos * att.r;
      const y1 = att.y + sin * att.r;
      const x2 = att.x + cos * (att.r + seg.reach);
      const y2 = att.y + sin * (att.r + seg.reach);

      // closest point on segment to defender center
      const ex = x2 - x1, ey = y2 - y1;
      const len2 = ex * ex + ey * ey || 1;
      let t = ((def.x - x1) * ex + (def.y - y1) * ey) / len2;
      t = Math.max(0, Math.min(1, t));
      const px = x1 + ex * t, py = y1 + ey * t;
      const dist = Math.hypot(def.x - px, def.y - py);

      let thick = att.weapon === 'hammer' ? 14 : att.weapon === 'hands' ? 12 : 6;
      if (spec === 'rage') thick *= 1.5;
      if (dist > def.r + thick) continue;

      // --- CONTACT ---
      if (seg.kind === 'palm') {
        // open palm: grab, then wall-slam along Kurt's trajectory
        if (att.grabCd <= 0 && !att.grab) {
          att.grab = { foe: def, t: 0.55, empowered: att.empowerT > 0 };
          def.grabbedBy = att;
          def.cooldown = Math.max(def.cooldown, 0.3);
          sfx.grab();
          spawnSparks(px, py, '#c08cff', 10, 200);
          if (att.grab.empowered) att.empowerT = 0;
        }
        continue;
      }

      if (def.cooldown > 0) continue;

      // specials modify the strike
      let dmg = att.dmg, knock = att.knock, victimCd = HIT_COOLDOWN;
      if (spec === 'whirlwind' || spec === 'flurry') { dmg = 4; victimCd = 0.3; }
      if (spec === 'skewer')  { dmg = 5; victimCd = 0.28; }
      if (spec === 'lunge')   { dmg = 15; knock = 540; }
      if (spec === 'drive')   { dmg = 16; knock = 520; }
      if (spec === 'megaton') { dmg = 17; knock = 680; }
      if (spec === 'rage')    { dmg = att.dmg + 6; knock = att.knock + 220; }

      def.hp = Math.max(0, def.hp - dmg);
      def.cooldown = victimCd;
      def.hitFlash = 0.25;

      // knockback: shove the defender away — can bounce them into walls
      let kx = def.x - px, ky = def.y - py;
      const kd = Math.hypot(kx, ky) || 1;
      def.vx += (kx / kd) * knock;
      def.vy += (ky / kd) * knock;

      if (att.weapon === 'hammer') sfx.hammer();
      else if (att.weapon === 'spear') sfx.spear();
      else if (att.weapon === 'hands') sfx.punch();
      else sfx.sword();
      const sparkColor = att.weapon === 'hammer' ? '#ffb347'
                       : att.weapon === 'hands' ? '#e6a3ff'
                       : att.weapon === 'spear' ? '#bdf5c9' : '#fff27a';
      spawnSparks(px, py, sparkColor, att.weapon === 'hammer' ? 16 : 10,
                  att.weapon === 'hammer' ? 320 : 220);
      spawnDamageText(def.x, def.y - def.r - 8, '-' + dmg, att.color);
      shake = spec ? 11 : (att.weapon === 'hammer' ? 9 : 5);
      updateHud();
    }
  }

  // --------------------------------------------------------------- particles

  function spawnSparks(x, y, color, n, speed) {
    for (let i = 0; i < n; i++) {
      const ang = Math.random() * Math.PI * 2;
      const sp = speed * (0.4 + Math.random() * 0.6);
      particles.push({
        x, y,
        vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
        life: 0.25 + Math.random() * 0.3,
        max: 0.55,
        size: 2 + Math.random() * 3,
        color, text: null,
      });
    }
  }

  function spawnDamageText(x, y, text, color) {
    particles.push({ x, y, vx: 0, vy: -55, life: 0.8, max: 0.8, size: 18, color, text });
  }

  // -------------------------------------------------------------------- draw

  function draw() {
    ctx.save();
    if (shake > 0) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }
    ctx.clearRect(-20, -20, W + 40, H + 40);

    // arena floor lines
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(W / 2, H / 2, 90, 0, Math.PI * 2);
    ctx.moveTo(W / 2, 0); ctx.lineTo(W / 2, H);
    ctx.stroke();

    if (!balls) { ctx.restore(); return; }

    // afterimage ghosts trail behind dashes and whirlwinds
    for (const g of ghosts) {
      ctx.save();
      ctx.globalAlpha = 0.3 * (g.life / g.max);
      if (g.body) {
        ctx.fillStyle = g.color;
        ctx.beginPath();
        ctx.arc(g.x, g.y, g.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.translate(g.x, g.y);
      ctx.rotate(g.wAngle);
      drawWeapon(g);
      ctx.restore();
    }

    // expanding seismic slam rings
    for (const s of shockwaves) {
      const fade = 1 - s.r / s.max;
      ctx.save();
      ctx.globalAlpha = fade;
      ctx.strokeStyle = '#ffb347';
      ctx.shadowColor = '#ffb347';
      ctx.shadowBlur = 20;
      ctx.lineWidth = 10 * fade + 2;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = '#fff3d6';
      ctx.lineWidth = 3 * fade + 1;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r * 0.82, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    // grab tether
    for (const b of balls) {
      if (!b.grab) continue;
      ctx.save();
      ctx.strokeStyle = '#c08cff';
      ctx.shadowColor = '#c08cff';
      ctx.shadowBlur = 12;
      ctx.lineWidth = 4;
      ctx.setLineDash([6, 6]);
      ctx.beginPath();
      ctx.moveTo(b.x, b.y);
      ctx.lineTo(b.grab.foe.x, b.grab.foe.y);
      ctx.stroke();
      ctx.restore();
    }

    for (const b of balls) drawBall(b);

    for (const p of projectiles) {
      ctx.save();
      ctx.translate(p.x, p.y);
      if (p.type === 'beam') {
        // glowing crescent of sword energy
        ctx.rotate(Math.atan2(p.vy, p.vx));
        ctx.strokeStyle = '#9fdcff';
        ctx.shadowColor = '#4da6ff';
        ctx.shadowBlur = 16;
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.arc(-8, 0, 17, -1.15, 1.15);
        ctx.stroke();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(-8, 0, 17, -0.8, 0.8);
        ctx.stroke();
      } else if (p.weapon === 'hammer') { // spinning thrown hammer
        ctx.rotate(p.spin);
        ctx.shadowColor = '#ffb347';
        ctx.shadowBlur = 12;
        ctx.fillStyle = '#8a5a2b';
        ctx.fillRect(-28, -4, 40, 8);
        const g = ctx.createLinearGradient(12, -16, 36, 16);
        g.addColorStop(0, '#b9c2cf');
        g.addColorStop(1, '#6e7886');
        ctx.fillStyle = g;
        roundRect(12, -16, 24, 32, 5);
        ctx.fill();
        ctx.strokeStyle = '#4a5260';
        ctx.lineWidth = 2;
        roundRect(12, -16, 24, 32, 5);
        ctx.stroke();
      } else { // hurled javelin, pointing along its flight
        ctx.rotate(Math.atan2(p.vy, p.vx));
        ctx.shadowColor = '#5ee68a';
        ctx.shadowBlur = 10;
        ctx.fillStyle = '#9a6a33';
        ctx.fillRect(-34, -2.5, 56, 5);
        ctx.fillStyle = '#e8eef7';
        ctx.beginPath();
        ctx.moveTo(22, 0); ctx.lineTo(30, -6); ctx.lineTo(40, 0); ctx.lineTo(30, 6);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    }

    for (const p of particles) {
      const a = Math.max(0, p.life / p.max);
      ctx.globalAlpha = a;
      if (p.text) {
        ctx.fillStyle = p.color;
        ctx.font = 'bold ' + p.size + 'px Segoe UI, Arial';
        ctx.textAlign = 'center';
        ctx.fillText(p.text, p.x, p.y);
      } else {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * a, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    // special move announcement banner (drawn unshaken, on top of everything)
    if (announce) {
      const fade = Math.min(1, announce.t / 0.35);
      const pop = 1 + Math.max(0, (announce.t - (announce.max - 0.15)) / 0.15) * 0.6;
      ctx.save();
      ctx.globalAlpha = fade;
      ctx.translate(W / 2, 64);
      ctx.scale(pop, pop);
      ctx.font = 'bold 34px Segoe UI, Arial';
      ctx.textAlign = 'center';
      ctx.fillStyle = announce.color;
      ctx.shadowColor = announce.color;
      ctx.shadowBlur = 18;
      ctx.fillText(announce.text, 0, 0);
      ctx.restore();
    }
  }

  function drawBall(b) {
    const spec = b.activeSpecial ? b.activeSpecial.key : null;

    // seismic slam windup: pulsing ring warns the hit is coming
    if (spec === 'slam' && !b.activeSpecial.fired) {
      const p = (b.activeSpecial.dur - b.activeSpecial.t) / b.activeSpecial.windup;
      ctx.save();
      ctx.globalAlpha = 0.5 + 0.4 * Math.sin(p * 25);
      ctx.strokeStyle = '#ffb347';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r + 14 - p * 8, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    // weapon first so it sits "behind" the ball at the hilt
    if (!b.weaponOut) {
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(b.wAngle);
      if (spec === 'rage') {
        ctx.shadowColor = '#ff3b3b';
        ctx.shadowBlur = 18;
      }
      drawWeapon(b, spec === 'rage' ? 1.45 : 1);
      ctx.restore();
    }

    // body (glows while a special is active)
    if (spec) {
      ctx.shadowColor = b.color;
      ctx.shadowBlur = 25;
    }
    const flash = b.hitFlash > 0;
    const grad = ctx.createRadialGradient(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.2, b.x, b.y, b.r);
    grad.addColorStop(0, flash ? '#ffffff' : b.color);
    grad.addColorStop(1, flash ? '#ffd0d0' : b.dark);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.shadowBlur = 0;

    // angry little eyes facing the enemy
    const foe = balls[0] === b ? balls[1] : balls[0];
    const fa = Math.atan2(foe.y - b.y, foe.x - b.x);
    for (const side of [-1, 1]) {
      const ex = b.x + Math.cos(fa + side * 0.45) * b.r * 0.45;
      const ey = b.y + Math.sin(fa + side * 0.45) * b.r * 0.45;
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(ex, ey, 6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#1a1e30';
      ctx.beginPath();
      ctx.arc(ex + Math.cos(fa) * 2.5, ey + Math.sin(fa) * 2.5, 3, 0, Math.PI * 2);
      ctx.fill();
    }

    // small HP ring around the ball
    ctx.strokeStyle = b.color;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r + 6, -Math.PI / 2, -Math.PI / 2 + (b.hp / MAX_HP) * Math.PI * 2);
    ctx.stroke();
  }

  // dispatch by weapon type; drawn in local space, +x along the weapon arm
  function drawWeapon(b, s = 1) {
    if (b.weapon === 'sword') drawSword(b);
    else if (b.weapon === 'hammer') drawHammer(b, s);
    else if (b.weapon === 'spear') drawSpear(b);
    else drawHands(b);
  }

  function drawSword(b) {
    const r = b.r, L = b.wLen;
    // hilt
    ctx.fillStyle = '#8a5a2b';
    ctx.fillRect(r - 8, -3, 16, 6);
    // crossguard
    ctx.fillStyle = '#c9a227';
    ctx.fillRect(r + 8, -10, 5, 20);
    // blade
    const g = ctx.createLinearGradient(r + 13, 0, r + L, 0);
    g.addColorStop(0, '#e8eef7');
    g.addColorStop(1, '#9fb4cc');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(r + 13, -5);
    ctx.lineTo(r + L - 10, -5);
    ctx.lineTo(r + L, 0);       // point
    ctx.lineTo(r + L - 10, 5);
    ctx.lineTo(r + 13, 5);
    ctx.closePath();
    ctx.fill();
    // fuller line
    ctx.strokeStyle = 'rgba(90,110,140,0.7)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(r + 14, 0); ctx.lineTo(r + L - 12, 0);
    ctx.stroke();
  }

  // s > 1 draws the enlarged Titan Rage version (longer handle, bigger head)
  function drawHammer(b, s = 1) {
    const r = b.r, L = b.wLen * (s > 1 ? 1.25 : 1);
    // handle
    ctx.fillStyle = '#8a5a2b';
    ctx.fillRect(r - 6, -4, L - 8, 8);
    ctx.strokeStyle = '#5d3c1b';
    ctx.lineWidth = 1;
    ctx.strokeRect(r - 6, -4, L - 8, 8);
    // head
    const g = ctx.createLinearGradient(r + L - 16 * s, -18 * s, r + L + 12 * s, 18 * s);
    g.addColorStop(0, s > 1 ? '#e0a3a3' : '#b9c2cf');
    g.addColorStop(1, s > 1 ? '#8a4a4a' : '#6e7886');
    ctx.fillStyle = g;
    roundRect(r + L - 16 * s, -18 * s, 28 * s, 36 * s, 5);
    ctx.fill();
    ctx.strokeStyle = '#4a5260';
    ctx.lineWidth = 2;
    roundRect(r + L - 16 * s, -18 * s, 28 * s, 36 * s, 5);
    ctx.stroke();
  }

  function drawSpear(b) {
    const r = b.r, L = b.wLen;
    // shaft
    ctx.fillStyle = '#9a6a33';
    ctx.fillRect(r - 6, -2.5, L - 12, 5);
    // binding
    ctx.fillStyle = '#c9a227';
    ctx.fillRect(r + L - 22, -4, 6, 8);
    // leaf-shaped tip
    const g = ctx.createLinearGradient(r + L - 16, 0, r + L, 0);
    g.addColorStop(0, '#e8eef7');
    g.addColorStop(1, '#9fb4cc');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(r + L - 16, 0);
    ctx.lineTo(r + L - 7, -6.5);
    ctx.lineTo(r + L, 0);
    ctx.lineTo(r + L - 7, 6.5);
    ctx.closePath();
    ctx.fill();
  }

  // Kurt: fist on the +x arm, open grabbing palm on the opposite arm
  function drawHands(b) {
    const r = b.r, L = b.wLen;
    // fist arm
    ctx.strokeStyle = '#7a57a8';
    ctx.lineWidth = 7;
    ctx.beginPath();
    ctx.moveTo(r - 4, 0);
    ctx.lineTo(r + L - 8, 0);
    ctx.stroke();
    // boxing-glove fist
    ctx.fillStyle = '#e05555';
    ctx.beginPath();
    ctx.arc(r + L, 0, 12, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#a83232';
    ctx.lineWidth = 2;
    ctx.stroke();
    // knuckle line
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(r + L + 3, 0, 7, -1.2, 1.2);
    ctx.stroke();

    // palm arm (glows when the grab is ready)
    ctx.save();
    ctx.rotate(Math.PI);
    if (b.grabCd !== undefined && b.grabCd <= 0) {
      ctx.shadowColor = '#6de0e0';
      ctx.shadowBlur = 12;
    }
    ctx.strokeStyle = '#7a57a8';
    ctx.lineWidth = 7;
    ctx.beginPath();
    ctx.moveTo(r - 4, 0);
    ctx.lineTo(r + L - 10, 0);
    ctx.stroke();
    // open palm with fingers
    ctx.fillStyle = '#6de0e0';
    roundRect(r + L - 14, -10, 12, 20, 4);
    ctx.fill();
    for (let i = 0; i < 4; i++) {
      roundRect(r + L - 2, -10 + i * 5.2, 9, 3.7, 1.8);
      ctx.fill();
    }
    ctx.restore();
  }

  function roundRect(x, y, w, h, rad) {
    ctx.beginPath();
    ctx.moveTo(x + rad, y);
    ctx.arcTo(x + w, y, x + w, y + h, rad);
    ctx.arcTo(x + w, y + h, x, y + h, rad);
    ctx.arcTo(x, y + h, x, y, rad);
    ctx.arcTo(x, y, x + w, y, rad);
    ctx.closePath();
  }

  // --------------------------------------------------------------------- ui

  function updateHud() {
    for (const b of balls) {
      b.hpEl.style.width = (b.hp / MAX_HP * 100) + '%';
      b.hpText.textContent = b.hp + ' / ' + MAX_HP;
    }
  }

  function updateSpecialHud() {
    for (const b of balls) {
      if (!b.spEls) continue;
      b.specials.forEach((s, i) => {
        const pct = Math.min(1, s.timer / s.charge);
        b.spEls[i].fill.style.width = (pct * 100) + '%';
        b.spEls[i].root.classList.toggle('ready', pct >= 1);
      });
    }
  }

  // -------------------------------------------------------- character select

  let sel = ['sword', 'hammer'];
  const cardEls = [[], []];

  function buildSelect() {
    [0, 1].forEach(side => {
      const wrap = document.getElementById('cards' + (side + 1));
      wrap.innerHTML = '';
      cardEls[side] = CHARS.map(c => {
        const card = document.createElement('div');
        card.className = 'card';
        card.style.setProperty('--cc', c.color);
        card.innerHTML = '<div class="cemoji">' + c.emoji + '</div>' +
                         '<div class="cname">' + c.name + '</div>' +
                         '<div class="ctag">' + c.ctag + '</div>' +
                         '<div class="crec">' + recText(c.id) + '</div>';
        card.addEventListener('click', () => {
          sel[side] = c.id;
          refreshSelect();
        });
        wrap.appendChild(card);
        return { el: card, id: c.id };
      });
    });
    refreshSelect();
  }

  function refreshSelect() {
    [0, 1].forEach(side => {
      for (const c of cardEls[side]) {
        c.el.classList.toggle('sel', sel[side] === c.id);
        c.el.querySelector('.crec').textContent = recText(c.id);
      }
    });
  }

  function showMenu() {
    overlayTitle.textContent = 'BATTLE BALL ARENA';
    overlayTitle.style.color = '#fff';
    overlaySub.textContent = 'Choose your fighters — weapons spin, contact deals damage.';
    selectBox.classList.remove('hidden');
    refreshSelect();
    playBtn.textContent = 'FIGHT!';
    changeBtn.classList.add('hidden');
    overlay.classList.remove('hidden');
  }

  function startFight() {
    initAudio();
    music.start();
    setupFight(sel[0], sel[1]);
    overlay.classList.add('hidden');
    running = true;
    lastTime = performance.now();
    const c1 = charById(sel[0]), c2 = charById(sel[1]);
    say(c1.speakName + ' versus ' + c2.speakName + '. Fight!');
    announce = { text: 'FIGHT!', color: '#ffd75e', t: 1.2, max: 1.2 };
  }

  function endFight(loser) {
    running = false;
    recordOf(winner.id).w++;
    recordOf(loser.id).l++;
    saveRecords();
    for (const b of balls) b.recEl.textContent = recText(b.id);
    say(winner.speakName + ' wins!');
    overlayTitle.textContent = winner.name + ' WINS!';
    overlayTitle.style.color = winner.color;
    overlaySub.textContent = loser.name + ' was knocked out at 0 HP. Career: ' +
      winner.name.replace(' II', '') + ' ' + recText(winner.id) + ' • ' +
      loser.name.replace(' II', '') + ' ' + recText(loser.id);
    selectBox.classList.add('hidden');
    playBtn.textContent = 'REMATCH';
    changeBtn.classList.remove('hidden');
    overlay.classList.remove('hidden');
  }

  playBtn.addEventListener('click', startFight);
  changeBtn.addEventListener('click', showMenu);

  // -------------------------------------------------------------------- loop

  function frame(now) {
    if (running) {
      const dt = Math.min(0.033, (now - lastTime) / 1000);
      lastTime = now;
      update(dt);
    }
    draw();
    requestAnimationFrame(frame);
  }

  buildSelect();
  showMenu();
  requestAnimationFrame(frame);

  // tiny hook for automated headless testing — not used by gameplay
  window.__bba = {
    get balls() { return balls; },
    get running() { return running; },
    select: (a, b2) => { sel = [a, b2]; },
    castSpecial, startFight,
  };
})();
</script>
</body>
</html>
